<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>陪跑台 · 通用行业解决方案架构师</title>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--tx:#1f2430;--tx2:#6b7280;--line:#e3e4e8;--blue:#2f6bff;--blueL:#eef3ff;--green:#16a34a;--greenL:#e8f7ee;--amber:#b8860b;--amberL:#fdf6e3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:16px}
header .sub{color:var(--tx2);font-size:12px}
nav{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:#fff;color:var(--tx2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
nav button.on{background:var(--blueL);border-color:var(--blue);color:var(--blue);font-weight:600}
main{padding:16px 20px 70px;max-width:1080px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 4px}
.card .sub{color:var(--tx2);font-size:12.5px;margin-bottom:8px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:13px}
.btn.sm{padding:5px 10px;font-size:12.5px}
.hint{color:var(--tx2);font-size:12px}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--tx)}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.dt th{background:var(--blueL);font-weight:600;white-space:nowrap}
table.dt td.wide{max-width:340px;line-height:1.5;color:var(--tx2)}
.empty{color:var(--tx2);font-size:13px;padding:14px 0}
.chat .body{height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafaf8}
.msg{max-width:86%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.u{background:#e6efff;align-self:flex-end}
.msg.a{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.sys{background:#f0f0ec;color:var(--tx2);font-size:12.5px;align-self:flex-start}
.chat .row{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.chat textarea{flex:1;resize:none;min-height:44px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cfd6e4;border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.archsvg{width:100%;height:auto}
.archsvg .cont{fill:#fafaf7;stroke:var(--line);stroke-width:0.5}
.archsvg .ts{font-size:12px;fill:var(--tx2)}
.archsvg .th{font-size:14px;font-weight:500;fill:var(--tx)}
.archsvg .c-blue rect{fill:#E6F1FB;stroke:#85B7EB;stroke-width:0.5}
.archsvg .c-amber rect{fill:#FAEEDA;stroke:#EF9F27;stroke-width:0.5}
.archsvg .ln{stroke:#b9c0cc;stroke-width:1.5;fill:none}
.fab{position:fixed;right:18px;bottom:18px;z-index:40;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 17px;font-weight:600;font-size:13.5px;cursor:pointer}
#aiPanel{position:fixed;right:18px;bottom:70px;z-index:41;width:380px;max-width:calc(100vw - 32px);height:min(70vh,520px);background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
#aiPanel.hidden{display:none}
.aihead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.aihead b{font-size:14px}
.aihead .hint{flex:1;color:var(--tx2);font-size:12px}
#aiPanel .body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:#fafaf8}
#aiPanel .row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
#aiPanel textarea{flex:1;resize:none;min-height:42px}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gate.hidden{display:none}
.gatebox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.gatebox h1{font-size:18px;margin:0 0 4px}
.gatebox .sub{color:var(--tx2);font-size:12.5px;margin-bottom:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:#fff;color:var(--tx2);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--blueL);border-color:var(--blue);color:var(--blue);font-weight:600}
.gatebox input{width:100%;margin-bottom:8px}
.gatebox .btn{width:100%;padding:9px}
.gatebox .btn.gray{margin-bottom:8px}
#gateMsg{color:var(--tx2);font-size:12.5px;margin-top:10px;min-height:18px}
#gateMsg.err{color:#c0392b}
.who{color:var(--tx2);font-size:12px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.calw{text-align:center;font-size:11.5px;color:var(--tx2)}
.cal{border:1px solid var(--line);border-radius:6px;text-align:center;padding:7px 0;font-size:12px;color:var(--tx2)}
.cal.on{background:var(--greenL);border-color:#97C459;color:#3B6D11;font-weight:600}
</style>
</head>
<body>
<header>
  <b>陪跑台</b>
  <span class="sub" id="conn"><span class="spin"></span>连接中…</span>
  <span class="who" id="who"></span>
  <button class="btn gray sm hidden" id="signOut">退出</button>
  <span class="sub" style="margin-left:auto">通用行业解决方案架构师 · 火山引擎</span>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<button id="aiFab" class="fab">AI 教练</button>
<div id="aiPanel" class="hidden"></div>
<div id="gate" class="gate">
  <div class="gatebox">
    <h1>陪跑台</h1>
    <div class="sub">登录后使用 · 架构师陪跑台</div>
    <div class="seg" id="gateSeg">
      <button data-mode="pwd" class="on">密码登录</button>
      <button data-mode="otp">邮箱验证码</button>
      <button data-mode="signup">注册</button>
      <button data-mode="forgot">忘记密码</button>
    </div>
    <div id="gateForm"></div>
    <div id="gateMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
/* ===================== 基础 ===================== */
var EP = "https://peipao-tai.app.workbuddy.host";
var PK = "wbpk_iTGkwbktahAc8tjJawUTr9_hF8DbMgE7LS0ZVxUqBtd3NCUWrMdgW4Q";
var AI_SYS = "你是「架构师陪跑台」的 AI 教练，服务冲刺火山引擎通用行业解决方案架构师（目标 30-60K·18薪）的候选人徐琛。背景：商业地产与零售行业的 AI 产品，如客流动线统计、运营分析、智能体 Agent。你的职责——① 点评他写的练习答案（概念复述 / 对标拆解 / 案例拆写 / 对话盘点），指出到位与缺口，给一句可直接背的版本；② 解释知识卡概念，用「为什么、怎么做、客户会怎么问」展开；③ 模拟面试追问。要求：场景化、效果化，用数字和案例说话；不讲空话套话；口吻像教练、内容可直接复用。";
var JD_SYS = "你是招聘信息提取助手。从用户提供的 BOSS 直聘岗位截图中提取结构化信息，只输出 JSON，不要任何解释或 markdown 代码块。字段：company(字符串,公司名)、position(字符串,岗位名)、requirement(字符串,概括岗位职责与任职要求,200字内)、domains(字符串数组,从[需求理解,平台化解决方案设计,产研协同,GTM与方法论沉淀,商业洞察]中选最相关的1到3个,没有就空数组)。";

var CLOUD=null, MODEL=null, VISION=null, READY=false;
var HIST=[], GEN=false, CID=null, TAB="arch";

function el(id){ return document.getElementById(id); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];}); }
function fmtDate(v){ if(!v) return ""; var d=new Date(v); if(isNaN(d)) return String(v); return d.toISOString().slice(0,10); }

/* ===================== 登录 / 注册 ===================== */
var GATE_MODE = "pwd", GATE_ST = {};

function showGate(){ var g=el("gate"); if(g) g.classList.remove("hidden"); }
function hideGate(){ var g=el("gate"); if(g) g.classList.add("hidden"); }
function gateMsg(t, isErr){ var m=el("gateMsg"); if(!m) return; m.textContent=t||""; m.className=isErr?"err":""; }
function authErrText(e){
  var k = String((e && (e.kind || e.code)) || "");
  if(k.indexOf("unauthenticated")>=0 || k.indexOf("invalid_grant")>=0) return "账号或验证码不正确，请重试。";
  if(k.indexOf("network")>=0 || k.indexOf("backend-unavailable")>=0) return "网络或服务暂时不可用，请稍后重试。";
  return (e && e.message) ? String(e.message) : "操作失败，请重试。";
}
function renderUser(u){
  var w=el("who"); if(w) w.textContent=(u && u.email) || "";
  var b=el("signOut"); if(b) b.classList.remove("hidden");
}
function renderGate(mode){
  GATE_MODE = mode || GATE_MODE;
  var seg = el("gateSeg");
  if(seg) Array.prototype.forEach.call(seg.querySelectorAll("button"), function(b){
    b.classList.toggle("on", b.dataset.mode===GATE_MODE);
    b.onclick = function(){ renderGate(b.dataset.mode); gateMsg(""); };
  });
  var h = "";
  if(GATE_MODE==="pwd"){
    h = '<input id="gEmail" type="email" placeholder="邮箱"><input id="gPwd" type="password" placeholder="密码"><button class="btn" id="gGo">登录</button>';
  } else if(GATE_MODE==="otp"){
    h = '<input id="gEmail" type="email" placeholder="邮箱"><button class="btn gray" id="gSend">发送验证码</button><input id="gCode" type="text" placeholder="邮箱收到的验证码"><button class="btn" id="gGo">验证并登录</button>';
  } else if(GATE_MODE==="signup"){
    h = '<input id="gEmail" type="email" placeholder="邮箱"><input id="gPwd" type="password" placeholder="设置密码（至少 6 位）"><button class="btn gray" id="gSend">发送验证码</button><input id="gCode" type="text" placeholder="邮箱收到的验证码"><button class="btn" id="gGo">完成注册</button>';
  } else {
    h = '<input id="gEmail" type="email" placeholder="邮箱"><button class="btn gray" id="gSend">发送验证码</button><input id="gCode" type="text" placeholder="邮箱收到的验证码"><input id="gPwd" type="password" placeholder="新密码（至少 6 位）"><button class="btn" id="gGo">重置并登录</button>';
  }
  el("gateForm").innerHTML = h;
  var s=el("gSend"); if(s) s.onclick = gateSend;
  el("gGo").onclick = gateGo;
}
function gateSend(){
  var email=(el("gEmail").value||"").trim();
  if(!email){ gateMsg("请填邮箱", true); return; }
  gateMsg("发送中…");
  if(GATE_MODE==="otp"){
    CLOUD.auth.signInWithOtp({ email: email }).then(function(r){
      if(r.error){ gateMsg(authErrText(r.error), true); return; }
      GATE_ST.verify = r.data.verify;
      gateMsg("验证码已发送，请查收邮箱。");
    }).catch(function(e){ gateMsg(authErrText(e), true); });
  } else if(GATE_MODE==="forgot"){
    CLOUD.auth.resetPasswordForEmail(email).then(function(r){
      if(r.error){ gateMsg(authErrText(r.error), true); return; }
      GATE_ST.updateUser = r.data.updateUser;
      gateMsg("验证码已发送，请查收邮箱。");
    }).catch(function(e){ gateMsg(authErrText(e), true); });
  } else {
    CLOUD.auth.sendOtp({ email: email }).then(function(r){
      if(r.error){ gateMsg(authErrText(r.error), true); return; }
      GATE_ST.sent = r.data;
      gateMsg("验证码已发送，请查收邮箱。");
    }).catch(function(e){ gateMsg(authErrText(e), true); });
  }
}
function gateGo(){
  if(GATE_MODE==="pwd"){
    var em=(el("gEmail").value||"").trim(), pw=el("gPwd").value||"";
    if(!em || !pw){ gateMsg("请填邮箱和密码", true); return; }
    gateMsg("登录中…");
    CLOUD.auth.signInWithPassword({ email: em, password: pw }).then(function(r){
      if(r.error){ gateMsg("账号或密码不正确", true); return; }
      gateMsg(""); hideGate();
      if(r.data && r.data.user) renderUser(r.data.user);
    }).catch(function(e){ gateMsg(authErrText(e), true); });
    return;
  }
  var code=(el("gCode").value||"").trim();
  if(!code){ gateMsg("请填验证码", true); return; }
  if(GATE_MODE==="otp"){
    if(!GATE_ST.verify){ gateMsg("请先发送验证码", true); return; }
    gateMsg("验证中…");
    GATE_ST.verify({ token: code }).then(function(r){
      if(r.error){ gateMsg(authErrText(r.error), true); return; }
      hideGate();
      if(r.data && r.data.user) renderUser(r.data.user);
    }).catch(function(e){ gateMsg(authErrText(e), true); });
  } else if(GATE_MODE==="signup"){
    if(!GATE_ST.sent){ gateMsg("请先发送验证码", true); return; }
    var np=el("gPwd").value||"";
    if(np.length<6){ gateMsg("密码至少 6 位", true); return; }
    gateMsg("提交中…");
    CLOUD.auth.verifyOtp({
      verificationId: GATE_ST.sent.verificationId,
      token: code,
      email: (el("gEmail").value||"").trim(),
      isExistingUser: GATE_ST.sent.isExistingUser,
      password: GATE_ST.sent.isExistingUser ? undefined : np
    }).then(function(r){
      if(r.error){ gateMsg(authErrText(r.error), true); return; }
      hideGate();
    }).catch(function(e){ gateMsg(authErrText(e), true); });
  } else {
    if(!GATE_ST.updateUser){ gateMsg("请先发送验证码", true); return; }
    var pw2=el("gPwd").value||"";
    if(pw2.length<6){ gateMsg("新密码至少 6 位", true); return; }
    gateMsg("重置中…");
    GATE_ST.updateUser({ nonce: code, password: pw2 }).then(function(r){
      if(r.error){ gateMsg(authErrText(r.error), true); return; }
      hideGate();
    }).catch(function(e){ gateMsg(authErrText(e), true); });
  }
}
function initAuth(){
  if(!CLOUD || !CLOUD.auth) return;
  CLOUD.auth.getSession().then(function(r){
    var s = r && r.data;
    if(s && s.user){ hideGate(); renderUser(s.user); }
    else { showGate(); renderGate("pwd"); }
  }).catch(function(){ showGate(); renderGate("pwd"); });
  try{
    CLOUD.auth.onAuthStateChange(function(event, session){
      if(event==="SIGNED_OUT"){ showGate(); }
      else if(session && session.user){ hideGate(); renderUser(session.user); }
    });
  }catch(e){}
}

/* ===================== 后端连接 ===================== */
function initCloud(){
  CID = "c_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  if(!window.WorkBuddyCloud){ el("conn").textContent = "组件未加载（无法访问 CDN）"; return; }
  try{ CLOUD = WorkBuddyCloud.createWorkBuddyCloud({ endpoint: EP, publishableKey: PK }); }
  catch(e){ el("conn").textContent = "初始化失败"; return; }
  CLOUD.llm.models.list().then(function(models){
    var list = models.filter(function(x){ return x.disabled!==true; });
    MODEL = list[0] || null;
    VISION = list.filter(function(x){ return x.supportsImages===true; })[0] || null;
    READY = !!MODEL;
    el("conn").textContent = READY ? ("已连接 · " + (MODEL.name||MODEL.id)) : "无可用模型";
    syncState();
  }).catch(function(e){
    el("conn").textContent = "连接失败：" + ((e && e.error && e.error.code) || "网络");
  });
}

/* ===================== 数据访问 ===================== */
function dbList(table, orderCol){
  return CLOUD.database.from(table).select("*").order(orderCol||"created_at", { ascending:false })
    .then(function(r){ if(r.error) throw r.error; return r.data||[]; });
}
function dbAdd(table, obj){
  return CLOUD.database.from(table).insert(obj).select()
    .then(function(r){ if(r.error) throw r.error; return (r.data||[])[0]; });
}

/* ===================== Tab 配置 ===================== */
var TABS = [
  { id:"arch",   label:"架构" },
  { id:"jd",     label:"JD" },
  { id:"main",   label:"主线" },
  { id:"side",   label:"辅线",   table:"side_knowledge",  cols:[["title","标题"],["category","分类"],["created_at","入库"]] },
  { id:"resume", label:"简历",   table:"resumes",         cols:[["version","版本"],["created_at","日期"],["content","内容"]] },
  { id:"study",  label:"学习档案" }
];

function renderTabs(){
  var h = "";
  TABS.forEach(function(t){ h += '<button data-tab="'+t.id+'"'+(t.id===TAB?' class="on"':'')+'>'+esc(t.label)+'</button>'; });
  el("tabs").innerHTML = h;
  Array.prototype.forEach.call(el("tabs").querySelectorAll("button"), function(b){
    b.onclick = function(){ TAB = b.dataset.tab; renderTabs(); render(); };
  });
}

/* ===================== 渲染 ===================== */
function render(){
  var t = TABS.filter(function(x){return x.id===TAB;})[0];
  if(TAB==="arch") return renderArch();
  if(TAB==="jd") return renderJD();
  if(TAB==="main") return renderMain();
  if(TAB==="study") return renderStudy();
  return renderTable(t);
}

function renderMain(){
  el("main").innerHTML =
    '<div class="card"><h2>主线 · 知识卡</h2><div class="sub">每日知识卡（核心概念 / 对标 / 落项目 / 深度资料）</div><div id="m1"><span class="spin"></span>加载中…</div></div>'+
    '<div class="card"><h2>主线 · 面试题库</h2><div class="sub">题目与答题框架</div><div id="m2"><span class="spin"></span>加载中…</div></div>'+
    '<div class="card"><h2>主线 · 素材库</h2><div class="sub">对标素材与原文</div><div id="m3"><span class="spin"></span>加载中…</div></div>';
  paintSimple("m1","knowledge_cards","created_at",[["title","标题"],["type","类型"],["domains","能力域"],["card_date","日期"]]);
  paintSimple("m2","interview_questions","created_at",[["question","题目"],["domains","能力域"],["answer","答题框架",1]]);
  paintSimple("m3","materials","created_at",[["title","标题"],["kind","类型"],["content","内容",1]]);
}

function renderStudy(){
  el("main").innerHTML =
    '<div class="card"><h2>学习档案 · 打卡日历</h2><div class="sub">本月打卡情况（绿色 = 已打卡）</div><div id="calBox"><span class="spin"></span>加载中…</div></div>'+
    '<div class="card"><h2>学习档案 · 学习记录</h2><div class="sub">按日期倒序</div><div id="tblLog"><span class="spin"></span>加载中…</div></div>'+
    '<div class="card"><h2>学习档案 · 能力项</h2><div class="sub">能力域与当前等级</div><div id="tblCap"><span class="spin"></span>加载中…</div></div>'+
    '<div class="card"><h2>学习档案 · 打卡明细</h2><div class="sub">学习日期与时长</div><div id="tblChk"><span class="spin"></span>加载中…</div></div>';
  dbList("checkins","checkin_date").then(function(rows){
    el("calBox").innerHTML = calHtml(rows.map(function(r){ return r.checkin_date; }));
  }).catch(function(){ el("calBox").innerHTML = '<div class="empty">读取失败</div>'; });
  paintSimple("tblLog","study_logs","log_date",[["log_date","日期"],["kind","类型"],["minutes","分钟"],["content","内容",1]]);
  paintSimple("tblCap","capabilities","updated_at",[["name","能力项"],["domain","域"],["level","等级"],["progress","进度"]]);
  paintSimple("tblChk","checkins","checkin_date",[["checkin_date","日期"],["minutes","分钟"]]);
}
function calHtml(dates){
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  var first = new Date(y, m, 1).getDay();
  var days = new Date(y, m+1, 0).getDate();
  var set = {};
  (dates||[]).forEach(function(d){ if(d) set[String(d).slice(0,10)] = true; });
  var h = '<div class="calgrid">';
  ['日','一','二','三','四','五','六'].forEach(function(w){ h += '<div class="calw">'+w+'</div>'; });
  for(var i=0;i<first;i++) h += '<div></div>';
  for(var d=1; d<=days; d++){
    var key = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    h += '<div class="cal' + (set[key] ? ' on' : '') + '">' + d + '</div>';
  }
  return h + '</div>';
}
function paintSimple(boxId, table, orderCol, cols){

  }).catch(function(e){

/* ===================== AI 教练 ===================== */
function openAI(){
  var p = el("aiPanel"); if(!p) return;
  p.classList.remove("hidden");
  if(!p.dataset.built){
    p.dataset.built = "1";
    p.innerHTML =
      '<div class="aihead"><b>AI 教练</b><span class="hint" id="aiState"></span><button class="btn gray sm" id="aiClose">关闭</button></div>'+
      '<div class="body" id="chatBody"></div>'+
      '<div class="row"><textarea id="aiInput" rows="2" placeholder="输入内容，Enter 发送 · Shift+Enter 换行"></textarea><button class="btn" id="aiSend">发送</button></div>';
    var d = document.createElement("div");
    d.className = "msg sys";
    d.textContent = "我是陪跑台 AI 教练。把你的练习答案、概念复述、或疑问贴进来。";
    el("chatBody").appendChild(d);
    el("aiClose").onclick = function(){ p.classList.add("hidden"); };
    var ta = el("aiInput");
    ta.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); aiSend(); } });
    el("aiSend").onclick = aiSend;
    syncState();
  }
  var t2 = el("aiInput"); if(t2) t2.focus();
}
function syncState(){
  var s = el("aiState"); if(!s) return;
  s.textContent = READY ? ("已连接 · " + ((MODEL && (MODEL.name||MODEL.id)) || "")) : "连接中…";
}
function aiBubble(role, text){
  var b = el("chatBody"); if(!b) return null;
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text||"";
  b.appendChild(d); b.scrollTop = b.scrollHeight;
  return d;
}
function aiSend(){
  if(GEN) return;
  var ta = el("aiInput"); if(!ta) return;
  var text = (ta.value||"").trim(); if(!text) return;
  if(!READY || !CLOUD || !MODEL){ aiBubble("sys","AI 尚未就绪，请稍候或刷新重试。"); return; }
  ta.value = "";
  aiBubble("u", text);
  HIST.push({role:"user", content:text});
  GEN = true;
  var bubble = aiBubble("a", "");
  var messages = [{role:"system", content:AI_SYS}].concat(HIST.slice(-16));
  var un = CLOUD.llm.chat.completions.create({ model:MODEL.id, messages:messages, stream:true, stream_options:{include_usage:true}, conversationId:CID });
  Promise.resolve(un).then(function(stream){
    return (async function(){
      var acc = "";
      for await (var chunk of stream){
        var dl = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
        if(dl && dl.content){ acc += dl.content; bubble.textContent = acc; var cb=el("chatBody"); if(cb) cb.scrollTop=cb.scrollHeight; }
      }
    })();
  }).then(function(){
    GEN = false;
    var t = bubble.textContent||""; if(t.trim()) HIST.push({role:"assistant", content:t});
  }).catch(function(e){
    GEN = false;
    bubble.className = "msg sys";
    bubble.textContent = "⚠️ " + ((e && e.error && e.error.message) || String(e));
  });
}

/* ===================== JD 解析 ===================== */
function renderJD(){
  el("main").innerHTML =
    '<div class="card" style="border-color:var(--green)"><h2>📸 BOSS 截图 → 自动解析入库</h2>'+
    '<div class="sub">上传 BOSS 直聘 JD 截图，AI 直接识别并写入下方表格（同一页面完成，不需跳转）。</div>'+
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
    '<input id="jdFile" type="file" accept="image/*">'+
    '<button class="btn" id="jdGo">识别并入库</button>'+
    '<span class="hint" id="jdMsg"></span></div>'+
    '<div id="jdPrev" style="margin-top:8px"></div></div>'+
    '<div class="card"><h2>✏️ 手动录入</h2>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">'+
    '<input id="mCo" placeholder="公司（必填）" style="flex:1;min-width:140px">'+
    '<input id="mPos" placeholder="岗位（必填）" style="flex:1;min-width:140px"></div>'+
    '<textarea id="mReq" rows="3" placeholder="JD 原文 / 核心要求" style="width:100%"></textarea>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
    '<input id="mUrl" placeholder="JD 链接（选填）" style="flex:1;min-width:160px">'+
    '<input id="mDom" placeholder="关联能力域（选填，逗号分隔）" style="width:220px">'+
    '<button class="btn sm" id="mAdd">入库</button><span class="hint" id="mMsg"></span></div></div>'+
    '<div class="card"><h2>已收录 JD</h2><div class="sub">共 <span id="jdCount">…</span> 条，按入库时间倒序</div><div id="jdTbl"><span class="spin"></span>加载中…</div></div>';

  el("jdGo").onclick = jdGo;
  el("mAdd").onclick = function(){
    var co = (el("mCo").value||"").trim(), po = (el("mPos").value||"").trim();
    if(!co || !po){ el("mMsg").textContent = "公司、岗位为必填"; return; }
    el("mMsg").textContent = "保存中…";
    dbAdd("jd_records", { company:co, position:po, requirement:(el("mReq").value||"").trim(), url:(el("mUrl").value||"").trim(), domains:(el("mDom").value||"").trim(), source:"手动录入" })
      .then(function(){ el("mMsg").textContent = "已入库 ✓"; el("mCo").value=el("mPos").value=el("mReq").value=el("mUrl").value=el("mDom").value=""; refreshJD(); })
      .catch(function(e){ el("mMsg").textContent = "失败：" + (e.message||e.code||e); });
  };
  refreshJD();
}
function refreshJD(){
  dbList("jd_records").then(function(rows){
    el("jdCount").textContent = rows.length;
    if(!rows.length){ el("jdTbl").innerHTML = '<div class="empty">还没有 JD，上传截图或手动录入。</div>'; return; }
    var h = '<table class="dt"><thead><tr><th>公司</th><th>岗位</th><th>核心要求</th><th>关联能力域</th><th>状态</th><th>入库</th></tr></thead><tbody>';
    rows.forEach(function(r){
      h += "<tr><td>"+esc(r.company)+"</td><td>"+esc(r.position)+"</td><td class='wide'>"+esc(r.requirement)+"</td><td>"+esc(r.domains)+"</td><td>"+esc(r.status)+"</td><td>"+fmtDate(r.created_at)+"</td></tr>";
    });
    el("jdTbl").innerHTML = h + "</tbody></table>";
  }).catch(function(e){ el("jdTbl").innerHTML = '<div class="empty">读取失败：'+esc(e.message||e.code||e)+'</div>'; });
}
function jdGo(){
  var f = el("jdFile"), msg = el("jdMsg");
  if(!f || !f.files || !f.files[0]){ msg.textContent = "请先选一张截图"; return; }
  if(!READY){ msg.textContent = "AI 未就绪，请稍候"; return; }
  if(!VISION){ msg.textContent = "⚠️ 当前没有支持图片识别的模型"; return; }
  msg.textContent = "读取图片…";
  var r = new FileReader();
  r.onload = function(){
    var dataURL = r.result;
    el("jdPrev").innerHTML = '<img src="'+dataURL+'" style="max-width:200px;border:1px solid var(--line);border-radius:8px">';
    msg.textContent = "识别中…";
    var acc = "";
    var p = CLOUD.llm.chat.completions.create({
      model: VISION.id,
      messages: [
        { role:"system", content: JD_SYS },
        { role:"user", content:[{type:"text", text:"请提取这份 JD"}, {type:"image_url", image_url:{url:dataURL}}] }
      ],
      stream: true, stream_options:{ include_usage:true }, conversationId: CID+"_jd"
    });
    Promise.resolve(p).then(function(stream){
      return (async function(){
        for await (var chunk of stream){
          var dl = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
          if(dl && dl.content) acc += dl.content;
        }
      })();
    }).then(function(){
      var txt = acc.trim(), m = txt.match(/\{[\s\S]*\}/); if(m) txt = m[0];
      var obj = JSON.parse(txt);
      var dom = obj.domains; dom = Array.isArray(dom) ? dom.join("、") : (dom||"");
      return dbAdd("jd_records", { company:(obj.company||"").trim(), position:(obj.position||"").trim(), requirement:(obj.requirement||"").trim(), domains:dom, source:"BOSS 截图" });
    }).then(function(){
      msg.textContent = "已识别并入库 ✓";
      el("jdFile").value = "";
      refreshJD();
    }).catch(function(e){
      msg.textContent = "⚠️ " + ((e && e.error && e.error.message) || e.message || String(e)) + "（可改用手动录入）";
    });
  };
  r.onerror = function(){ msg.textContent = "图片读取失败，请重试"; };
  r.readAsDataURL(f.files[0]);
}
